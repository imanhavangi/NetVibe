services:
  postgres_db:
    image: postgres:15-alpine
    container_name: netvibe_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - netvibe_network

  redis_cache:
    image: redis:7-alpine
    container_name: netvibe_redis
    restart: always
    networks:
      - netvibe_network

  backend_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netvibe_backend
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SUBMISSION_RATE_LIMIT=${SUBMISSION_RATE_LIMIT:-600}
    depends_on:
      - postgres_db
      - redis_cache
    networks:
      - netvibe_network

  frontend_app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netvibe_frontend
    restart: always
    depends_on:
      - backend_api
    networks:
      - netvibe_network

  nginx_proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: netvibe_nginx
    restart: always
    ports:
      - "${NGINX_PORT:-8008}:80"
    depends_on:
      - frontend_app
      - backend_api
    networks:
      - netvibe_network

volumes:
  postgres_data:

networks:
  netvibe_network:
    driver: bridge
